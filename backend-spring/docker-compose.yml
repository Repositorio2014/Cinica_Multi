version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: clinica-multi-postgres
    environment:
      POSTGRES_DB: clinica_multi
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
